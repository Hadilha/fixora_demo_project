# Generated by Fixora VS Code extension
# Direct backend mode: no Fixora CLI is required in GitHub Actions.
# The action collects repository files and sends them to /api/v1/devsecops/sarif.

name: Fixora Security Gate

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  fixora-security:
    name: Fixora Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Fixora secrets
        env:
          FIXORA_BACKEND_URL: ${{ secrets.FIXORA_BACKEND_URL }}
          FIXORA_TOKEN: ${{ secrets.FIXORA_TOKEN }}
        run: |
          if [ -z "$FIXORA_BACKEND_URL" ]; then
            echo "::error::Missing GitHub secret FIXORA_BACKEND_URL"
            exit 1
          fi
          if [ -z "$FIXORA_TOKEN" ]; then
            echo "::error::Missing GitHub secret FIXORA_TOKEN"
            exit 1
          fi

      - name: Run Fixora backend gate
        env:
          FIXORA_BACKEND_URL: ${{ secrets.FIXORA_BACKEND_URL }}
          FIXORA_TOKEN: ${{ secrets.FIXORA_TOKEN }}
          FIXORA_GATE_THRESHOLD: HIGH
          FIXORA_GATE_TIMEOUT_MS: "1800000"
        run: |
          node .github/scripts/fixora-gate.js

      - name: Upload Fixora JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixora-report
          path: fixora-report.json
          if-no-files-found: ignore

      - name: Upload Fixora SARIF to GitHub Security
        if: always() && hashFiles('fixora.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fixora.sarif
