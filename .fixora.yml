# Generated by Fixora VS Code extension
# Fixora project policy.
# Commit this file. Do not put tokens, passwords, API keys, or private URLs here.

threshold: HIGH
trusted_only: true
min_confidence: 0.0

scan:
  include:
    # Code scanning: Path A / Path B / Path C
    - "**/*.py"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.java"
    - "**/*.go"
    - "**/*.rb"
    - "**/*.php"

    # Supply-chain / IaC / container scanning: Path D / Snyk
    - "package.json"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "requirements.txt"
    - "Pipfile"
    - "Pipfile.lock"
    - "poetry.lock"
    - "pyproject.toml"
    - "Dockerfile"
    - "**/Dockerfile"
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "**/*.tf"
    - "**/*.tfvars"
    - "k8s/**/*.yml"
    - "k8s/**/*.yaml"
    - "kubernetes/**/*.yml"
    - "kubernetes/**/*.yaml"
    - ".github/workflows/**/*.yml"
    - ".github/workflows/**/*.yaml"
  exclude:
    - ".git/**"
    - ".fixora/**"
    - "node_modules/**"
    - ".venv/**"
    - "venv/**"
    - ".venv-snyk/**"
    - "__pycache__/**"
    - "dist/**"
    - "build/**"
    - ".next/**"
    - "target/**"
    - "coverage/**"
    - ".github/scripts/**"
    - "fixora-report.json"
    - "fixora.sarif"
    - "**/*.before-fixora-*"

gate:
  block_critical: true
  block_high: true

supply_chain:
  enabled: true
  mode: auto
  scan_dependencies: true
  scan_iac: true
  scan_container: false
  scan_licenses: true

reports:
  json: fixora-report.json
  sarif: fixora.sarif
